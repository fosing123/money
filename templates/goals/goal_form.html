{% extends 'base.html' %}
{% block title %}New goal{% endblock %}
{% block content %}
<section class="card wide-card">
    <h1>Create a goal</h1>
    <form method="post">
        {% csrf_token %}
        <p><label>Name</label><input type="text" name="name"></p>
        <p><label>Target amount</label><input type="number" step="0.01" name="target_amount"></p>
        <p><label>Current amount</label><input type="number" step="0.01" name="current_amount" value="0"></p>
        <p><label>Currency</label><input type="text" name="currency" value="XAF"></p>
        <p><label>Description</label><textarea name="description"></textarea></p>
        <button class="button" type="submit">Create goal</button>
    </form>
</section>
{% endblock %}
