{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8F5FF">
  <meta name="color-scheme" content="light">
  <meta name="description" content="TIANA is your money friend. Track expenses, save for goals and get personal money guidance.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="TIANA — Your Money Friend Always">
  <meta property="og:description" content="Take control of your money, reach your goals and get friendly financial guidance.">
  <title>{% block title %}TIANA — Your Money Friend Always{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="{% static 'assets/tiana-welcome-student-campus-4k.jpg' %}" fetchpriority="high">
  <link rel="preload" as="image" href="{% static 'assets/tiana-logo-transparent.png' %}">
  <link rel="stylesheet" href="{% static 'nkem/welcome.css' %}?v=20261031-tiana-welcome">
</head>
<body class="welcome-page">
  <main class="welcome-screen" aria-label="Welcome to TIANA">
    <picture class="welcome-photo" aria-hidden="true">
      <img
        src="{% static 'assets/tiana-welcome-student-campus-4k.jpg' %}"
        alt=""
        fetchpriority="high"
        decoding="async"
      >
    </picture>

    <div class="welcome-shade" aria-hidden="true"></div>
    <span class="welcome-crystal welcome-crystal-one" aria-hidden="true"></span>
    <span class="welcome-crystal welcome-crystal-two" aria-hidden="true"></span>
    <span class="welcome-sparkle welcome-sparkle-one" aria-hidden="true">✦</span>
    <span class="welcome-sparkle welcome-sparkle-two" aria-hidden="true">✦</span>

    <header class="welcome-brand">
      <a class="welcome-wordmark" href="{% url 'home' %}" aria-label="TIANA — Your Money Friend Always">
        <img
          src="{% static 'assets/tiana-logo-transparent.png' %}"
          alt="TIANA — Your Money Friend Always"
          width="1660"
          height="716"
          fetchpriority="high"
          decoding="async"
        >
      </a>
    </header>

    <section class="welcome-content" aria-labelledby="welcome-heading">
      <div class="welcome-copy">
        <h1 id="welcome-heading">
          <span>Take control</span>
          <span>of your money</span>
          <span>today</span>
        </h1>
        <p>Track expenses, save for your goals, discover opportunities and get personalized advice.</p>
      </div>

      <a class="welcome-cta" href="{% url 'onboarding' %}">
        <span>Get Started</span>
        <svg viewBox="0 0 30 24" aria-hidden="true" focusable="false">
          <path d="M2 12h23M16 3l9 9-9 9" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </section>
  </main>
</body>
</html>
