{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8F6FF">
  <meta name="color-scheme" content="light">
  <meta name="description" content="TIANA is your money friend. Track expenses, save for goals and get personal money guidance.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="TIANA — Your Money Friend Always">
  <meta property="og:description" content="Take control of your money, reach your goals and get friendly financial guidance.">
  <title>{% block title %}TIANA — Your Money Friend Always{% endblock %}</title>
  <link rel="preload" as="image" href="{% static 'assets/nkem-welcome-hero-4k.avif' %}" fetchpriority="high">
  <link rel="stylesheet" href="{% static 'nkem/welcome.css' %}?v=20261030-tiana">
</head>
<body class="welcome-page">
  <main class="welcome-screen" aria-label="Welcome to TIANA">
    <img
      class="welcome-photo"
      src="{% static 'assets/nkem-welcome-hero-4k.avif' %}"
      alt="A student in a lavender hoodie smiling as she uses her phone on campus"
      fetchpriority="high"
      decoding="async"
    >
    <div class="welcome-shade" aria-hidden="true"></div>
    <div class="welcome-status" aria-label="Status bar">
      <span class="welcome-time">9:41</span>
      <span class="welcome-status-icons" aria-hidden="true">
        <svg class="status-signal" viewBox="0 0 26 20"><path d="M2 16.5h3v2H2zM8 12h3v6.5H8zM14 7h3v11.5h-3zM20 2h3v16.5h-3z" fill="currentColor"/></svg>
        <svg class="status-wifi" viewBox="0 0 24 20"><path d="M2 6.5C7.7 1.8 16.3 1.8 22 6.5L12 18 2 6.5Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10.5c3.4-2.7 8.6-2.7 12 0M9.3 13.7c1.6-1.2 3.8-1.2 5.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="status-battery" viewBox="0 0 34 18"><rect x="1" y="1" width="28" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="4" width="21" height="10" rx="2" fill="currentColor"/><path d="M31 6v6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      </span>
    </div>
    <header class="welcome-brand">
      <a class="welcome-wordmark" href="{% url 'home' %}" aria-label="TIANA home">
        <img src="{% static 'nkem/nkem-logo.svg' %}" alt="TIANA">
      </a>
      <p class="welcome-tagline">Your Money Friend Always</p>
    </header>
    <footer class="welcome-footer">
      <div class="welcome-copy">
        <h1>Take control of your money today</h1>
        <p>Track expenses, save for your goals, discover opportunities and get personalized advice.</p>
      </div>
      <a class="welcome-cta" href="{% url 'onboarding' %}">
        <span>Get Started</span>
        <svg viewBox="0 0 30 24" aria-hidden="true"><path d="M2 12h23M16 3l9 9-9 9" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <p class="welcome-signin">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
    </footer>
  </main>
</body>
</html>
