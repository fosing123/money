{% extends 'base.html' %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="card auth-card">
    <h1>Create your Nkem account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Create account</button>
    </form>
    <p class="muted-text">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</section>
{% endblock %}
