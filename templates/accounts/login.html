{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="card auth-card">
    <h1>Welcome back</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Log in</button>
    </form>
    <p class="muted-text">Need an account? <a href="{% url 'register' %}">Create one</a></p>
</section>
{% endblock %}
