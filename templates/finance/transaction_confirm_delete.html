{% extends 'base.html' %}
{% block title %}Delete transaction{% endblock %}
{% block content %}
<section class="card auth-card">
    <h1>Delete transaction</h1>
    <p>Are you sure you want to remove {{ transaction.description|default:transaction.category }}?</p>
    <form method="post">
        {% csrf_token %}
        <button class="button button-secondary" type="submit">Confirm delete</button>
        <a class="button" href="{% url 'transactions' %}">Cancel</a>
    </form>
</section>
{% endblock %}
