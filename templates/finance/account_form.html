{% extends 'base.html' %}
{% block title %}Add an account · TIANA{% endblock %}
{% block content %}
<div class="page-heading"><div><h1>Add an account</h1><p class="section-copy">Tracking only. No money is moved.</p></div></div>
<section class="card form-card"><form method="post" novalidate>{% csrf_token %}{{ form.as_p }}<div class="form-actions"><button class="button" type="submit">Save account</button><a class="button button-secondary" href="{% url 'dashboard' %}">Cancel</a></div></form></section>
{% endblock %}
