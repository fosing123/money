name: Django CI

on:
  push:
    branches:
      - main
      - feat/tiana-django-cloudflare-cleanup-20261101
      - feat/tiana-expense-analyzer-foundation-20261105
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "1"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_URL: "sqlite:///db.sqlite3"
      AI_PROVIDER: "none"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-django.txt
      - name: Install Django dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-django.txt
      - name: Check Django configuration
        run: python manage.py check

      - name: Verify Cloudflare PostgreSQL backend imports
        env:
          DEBUG: "0"
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          ALLOWED_HOSTS: "localhost"
          DATABASE_URL: "postgresql://tiana:unused@127.0.0.1:5432/neondb"
          DJANGO_DB_BACKEND: "nkem.db_backends.pg8000"
        run: |
          PYTHONPATH=src python manage.py check
          DJANGO_SETTINGS_MODULE=nkem.settings PYTHONPATH=src python -c "from django.db import connections; db = connections['default']; assert db.vendor == 'postgresql_pg8000' and db.features.supports_json_field; print('TIANA pg8000 backend and JSONField feature check passed')"
      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Check Django service-worker JavaScript
        run: node --check tiana-service-worker.js && node --check static/nkem/offline-core.js && node --check static/nkem/offline.js && node --check static/nkem/pwa.js && node --check static/nkem/fcm.js
      - name: Run Django tests
        run: python manage.py test
