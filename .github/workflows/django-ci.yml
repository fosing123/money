name: Django CI

on:
  push:
    branches:
      - "feat/tiana-django-rebuild-enhanced-mvp-20261029"
      - "feat/nkem-reference-welcome-screen-20261030"
      - "feat/tiana-home-dashboard-tour-20261031"
      - "feat/tiana-ui-polish-profile-forms-20261031"
      - "feat/tiana-transaction-onboarding-refresh-20261101"
      - "feat/tiana-pwa-offline-premium-sync-20261101"
  pull_request:
    branches:
      - "main"
      - "feat/tiana-django-rebuild-enhanced-mvp-20261029"
      - "feat/tiana-home-dashboard-tour-20261031"
      - "feat/tiana-ui-polish-profile-forms-20261031"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "1"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_URL: "sqlite:///db.sqlite3"
      AI_PROVIDER: "none"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-django.txt
      - name: Install Django dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-django.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Check JavaScript syntax
        run: node --check tiana-service-worker.js && node --check static/nkem/offline-core.js && node --check static/nkem/offline.js && node --check static/nkem/pwa.js
      - name: Check privacy-first PWA JavaScript
        run: |
          node --check web/app.js
          node --check web/vault.js
          node --check web/install-gate.js
          node --check web/privacy-telemetry.js
          node --check web/google-drive-backup.js
          node --check web/sw.js
          node --check functions/_shared.js
          node --check functions/api/config.js
          node --check functions/api/status.js
          node --check functions/api/telemetry.js
          node --check functions/api/admin/summary.js
          node --check functions/api/admin/devices.js
          node --check functions/api/admin/ban.js
          node scripts/verify-privacy-first.mjs
      - name: Run tests
        run: python manage.py test
