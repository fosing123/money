name: Django CI

on:
  push:
    branches:
      - main
      - feat/tiana-django-cloudflare-cleanup-20261101
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "1"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_URL: "sqlite:///db.sqlite3"
      AI_PROVIDER: "none"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-django.txt
      - name: Install Django dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-django.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Check Django service-worker JavaScript
        run: node --check tiana-service-worker.js && node --check static/nkem/offline-core.js && node --check static/nkem/offline.js && node --check static/nkem/pwa.js && node --check static/nkem/fcm.js
      - name: Run Django tests
        run: python manage.py test
