name: Django checks
on:
  push:
    branches:
      - feat/tiana-full-app-redesign-20261029
  pull_request:
    branches:
      - main
      - feat/tiana-django-integration
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "1"
      SECRET_KEY: "ci-only-not-a-production-secret"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-django.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-django.txt
      - name: Check Django settings
        run: python manage.py check
      - name: Check migrations are in sync
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Run tests
        run: python manage.py test --verbosity=2