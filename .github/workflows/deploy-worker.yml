name: Deploy TIANA Django Worker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - feat/tiana-money-intelligence-foundation-20261105
  workflow_dispatch:

concurrency:
  group: tiana-django-worker-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and deploy staging Worker
    runs-on: ubuntu-latest
    environment: tiana-django-staging
    permissions:
      contents: read
    env:
      DEBUG: "1"
      SECRET_KEY: "ci-static-collection-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_URL: "sqlite:///db.sqlite3"
      AI_PROVIDER: "none"
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cloudflare deployment credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID)
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf '::error::Missing GitHub environment values: %s\\n' "${missing[*]}"
            echo "Add Cloudflare credentials under repository Settings > Environments > tiana-django-staging."
            exit 1
          fi
          echo "Cloudflare deployment credentials are present. Existing Worker runtime secrets are preserved."

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python Worker dependencies
        run: uv sync --all-groups

      - name: Check Django configuration and migrations
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run

      - name: Verify Cloudflare PostgreSQL backend imports
        env:
          DEBUG: "0"
          SECRET_KEY: "ci-static-collection-key"
          ALLOWED_HOSTS: "localhost"
          DATABASE_URL: "postgresql://tiana:unused@127.0.0.1:5432/neondb"
          DJANGO_DB_BACKEND: "nkem.db_backends.pg8000"
        run: |
          PYTHONPATH=src uv run python manage.py check
          DJANGO_SETTINGS_MODULE=nkem.settings PYTHONPATH=src uv run python -c "from django.db import connections; db = connections['default']; assert db.vendor == 'postgresql_pg8000' and db.features.supports_json_field; print('TIANA pg8000 backend and JSONField feature check passed')"

      - name: Run Django tests
        run: uv run python manage.py test

      - name: Check service-worker JavaScript
        run: |
          node --check tiana-service-worker.js
          node --check static/nkem/offline-core.js
          node --check static/nkem/offline.js
          node --check static/nkem/pwa.js
          node --check static/nkem/fcm.js

      - name: Generate responsive WebP image assets
        run: uv run python scripts/optimize_images.py

      - name: Collect Django static assets
        run: uv run python manage.py collectstatic --noinput

      - name: Deploy to Cloudflare staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy

      - name: Smoke-test the deployed staging application
        shell: bash
        run: |
          set -euo pipefail
          url='https://tiana-django-staging.fosingkameni.workers.dev/'
          health_url="${url}health/"
          for attempt in {1..8}; do
            status=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$health_url" || true)
            if [[ "$status" == "200" ]]; then
              root_status=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$url" || true)
              if [[ "$root_status" =~ ^(200|301|302|303|307|308)$ ]]; then
                echo "TIANA staging application and PostgreSQL health checks passed (health HTTP $status; root HTTP $root_status)."
                exit 0
              fi
            fi
            echo "Staging database health check is not ready (HTTP ${status:-no-response}); retry $attempt/8."
            sleep 5
          done
          echo "::error::TIANA staging did not pass its PostgreSQL health check."
          exit 1
