name: Deploy TIANA Django Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tiana-django-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and deploy staging Worker
    runs-on: ubuntu-latest
    environment: tiana-django-staging
    permissions:
      contents: read
    env:
      DEBUG: "1"
      SECRET_KEY: "ci-static-collection-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_URL: "sqlite:///db.sqlite3"
      AI_PROVIDER: "none"
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cloudflare and TIANA runtime credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || vars.DJANGO_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || vars.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY || vars.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_AUTH_DOMAIN: ${{ secrets.FIREBASE_WEB_AUTH_DOMAIN || vars.FIREBASE_WEB_AUTH_DOMAIN }}
          FIREBASE_WEB_PROJECT_ID: ${{ secrets.FIREBASE_WEB_PROJECT_ID || vars.FIREBASE_WEB_PROJECT_ID }}
          FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_WEB_MESSAGING_SENDER_ID || vars.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID || vars.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_VAPID_KEY: ${{ secrets.FIREBASE_WEB_VAPID_KEY || vars.FIREBASE_WEB_VAPID_KEY }}
        shell: bash
        run: |
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DJANGO_SECRET_KEY GEMINI_API_KEY FIREBASE_SERVICE_ACCOUNT_JSON FIREBASE_WEB_API_KEY FIREBASE_WEB_AUTH_DOMAIN FIREBASE_WEB_PROJECT_ID FIREBASE_WEB_MESSAGING_SENDER_ID FIREBASE_WEB_APP_ID FIREBASE_WEB_VAPID_KEY)
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf '::error::Missing GitHub environment values: %s\n' "${missing[*]}"
            echo "Add secret values under repository Settings > Environments > tiana-django-staging. Public Firebase web configuration may be stored as environment variables."
            exit 1
          fi
          echo "Cloudflare deployment and all TIANA runtime credentials are present."

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python Worker dependencies
        run: uv sync --all-groups

      - name: Check Django configuration and migrations
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: uv run python manage.py test

      - name: Check service-worker JavaScript
        run: |
          node --check tiana-service-worker.js
          node --check static/nkem/offline-core.js
          node --check static/nkem/offline.js
          node --check static/nkem/pwa.js
          node --check static/nkem/fcm.js

      - name: Collect Django static assets
        run: uv run python manage.py collectstatic --noinput

      - name: Sync TIANA runtime secrets to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || vars.DJANGO_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || vars.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY || vars.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_AUTH_DOMAIN: ${{ secrets.FIREBASE_WEB_AUTH_DOMAIN || vars.FIREBASE_WEB_AUTH_DOMAIN }}
          FIREBASE_WEB_PROJECT_ID: ${{ secrets.FIREBASE_WEB_PROJECT_ID || vars.FIREBASE_WEB_PROJECT_ID }}
          FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_WEB_MESSAGING_SENDER_ID || vars.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID || vars.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_VAPID_KEY: ${{ secrets.FIREBASE_WEB_VAPID_KEY || vars.FIREBASE_WEB_VAPID_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in DJANGO_SECRET_KEY GEMINI_API_KEY FIREBASE_SERVICE_ACCOUNT_JSON FIREBASE_WEB_API_KEY FIREBASE_WEB_AUTH_DOMAIN FIREBASE_WEB_PROJECT_ID FIREBASE_WEB_MESSAGING_SENDER_ID FIREBASE_WEB_APP_ID FIREBASE_WEB_VAPID_KEY; do
            printf '%s' "${!name}" | npx --yes wrangler secret put "$name" --name tiana-django-staging
          done
          echo "All TIANA runtime credentials were synced to the staging Worker as encrypted Cloudflare secrets."

      - name: Deploy to Cloudflare staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy

      - name: Smoke-test the deployed staging application
        shell: bash
        run: |
          set -euo pipefail
          url='https://tiana-django-staging.fosingkameni.workers.dev/'
          for attempt in {1..8}; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$url" || true)
            if [[ "$status" =~ ^(200|301|302|303|307|308)$ ]]; then
              echo "TIANA staging HTTP smoke test passed (HTTP $status)."
              exit 0
            fi
            echo "Staging is not healthy yet (HTTP ${status:-no-response}); retry $attempt/8."
            sleep 5
          done
          echo "::error::TIANA staging did not return a successful HTTP response."
          exit 1
