name: Deploy TIANA Django Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tiana-django-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and deploy staging Worker
    runs-on: ubuntu-latest
    environment: tiana-django-staging
    permissions:
      contents: read
    env:
      DEBUG: "1"
      SECRET_KEY: "ci-static-collection-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_URL: "sqlite:///db.sqlite3"
      AI_PROVIDER: "none"
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cloudflare and TIANA runtime credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY || secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_AUTH_DOMAIN: ${{ vars.FIREBASE_WEB_AUTH_DOMAIN || secrets.FIREBASE_WEB_AUTH_DOMAIN }}
          FIREBASE_WEB_PROJECT_ID: ${{ vars.FIREBASE_WEB_PROJECT_ID || secrets.FIREBASE_WEB_PROJECT_ID }}
          FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_WEB_MESSAGING_SENDER_ID || secrets.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID || secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_VAPID_KEY: ${{ vars.FIREBASE_WEB_VAPID_KEY || secrets.FIREBASE_WEB_VAPID_KEY }}
        shell: bash
        run: |
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GEMINI_API_KEY FIREBASE_SERVICE_ACCOUNT_JSON)
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf '::error::Missing GitHub environment values: %s\n' "${missing[*]}"
            echo "Add secret values under repository Settings > Environments > tiana-django-staging. Public Firebase web configuration may be stored as environment variables."
            exit 1
          fi
          echo "Cloudflare, Gemini, and Firebase Admin credentials are present. Firebase browser push configuration is optional and can be added later."

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python Worker dependencies
        run: uv sync --all-groups

      - name: Check Django configuration and migrations
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run

      - name: Verify Cloudflare PostgreSQL backend imports
        env:
          DEBUG: "0"
          SECRET_KEY: "ci-static-collection-key"
          ALLOWED_HOSTS: "localhost"
          DATABASE_URL: "postgresql://tiana:unused@127.0.0.1:5432/neondb"
          DJANGO_DB_BACKEND: "nkem.db_backends.pg8000"
        run: |
          PYTHONPATH=src uv run python manage.py check
          DJANGO_SETTINGS_MODULE=nkem.settings PYTHONPATH=src uv run python -c "from django.db import connections; from django_pg8000.base import DatabaseConnection; from nkem.db_backends.pg8000.base import HyperdriveDatabaseConnection; db = connections['default']; assert db.vendor == 'postgresql_pg8000'; assert db.features.supports_json_field; assert issubclass(HyperdriveDatabaseConnection, DatabaseConnection); assert HyperdriveDatabaseConnection._run is not DatabaseConnection._run; print('TIANA Hyperdrive-safe pg8000 backend check passed')"

      - name: Run TIANA Analyzer regression tests
        run: uv run python manage.py test expense_analyzer --verbosity=2
      - name: Run remaining non-core Django app tests
        run: uv run python manage.py test accounts ai_assistant budgets finance goals insights marketplace notifications --verbosity=2
      - name: Run core app tests outside the separate Hyperdrive protocol suite
        run: uv run python manage.py test core.tests.WelcomePageTests core.tests.PWAOfflineAndPremiumTests core.tests.MoneyIntelligenceTests core.tests.AccountsCentreTests core.tests.BudgetIntelligencePageTests core.tests.BudgetCurrencySeparationTests core.tests.HealthCheckTests core.tests.CloudflareWorkerDependencyTests core.test_adsterra --verbosity=2

      - name: Check service-worker JavaScript
        run: |
          node --check tiana-service-worker.js
          node --check static/nkem/offline-core.js
          node --check static/nkem/offline.js
          node --check static/nkem/pwa.js
          node --check static/nkem/fcm.js
          node --check static/nkem/money-analysis-modal.js

      - name: Generate responsive WebP image assets
        run: uv run python scripts/optimize_images.py

      - name: Collect Django static assets
        run: uv run python manage.py collectstatic --noinput

      - name: Sync TIANA runtime secrets to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY || secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_AUTH_DOMAIN: ${{ vars.FIREBASE_WEB_AUTH_DOMAIN || secrets.FIREBASE_WEB_AUTH_DOMAIN }}
          FIREBASE_WEB_PROJECT_ID: ${{ vars.FIREBASE_WEB_PROJECT_ID || secrets.FIREBASE_WEB_PROJECT_ID }}
          FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_WEB_MESSAGING_SENDER_ID || secrets.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID || secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_VAPID_KEY: ${{ vars.FIREBASE_WEB_VAPID_KEY || secrets.FIREBASE_WEB_VAPID_KEY }}
          ADSTERRA_ENABLED: ${{ vars.ADSTERRA_ENABLED || 'false' }}
          ADSTERRA_WEBSITE_ID: ${{ vars.ADSTERRA_WEBSITE_ID || '6182605' }}
          ADSTERRA_BANNER_320X50_CODE: ${{ secrets.ADSTERRA_BANNER_320X50_CODE || secrets.ADSTERRA_NATIVE_BANNER_CODE }}
          ADSTERRA_BANNER_300X250_CODE: ${{ secrets.ADSTERRA_BANNER_300X250_CODE }}
        shell: bash
        run: |
          set -euo pipefail
          for name in GEMINI_API_KEY FIREBASE_SERVICE_ACCOUNT_JSON; do
            printf '%s' "${!name}" | npx --yes wrangler versions secret put "$name" --name tiana-django-staging
          done
          for name in FIREBASE_WEB_API_KEY FIREBASE_WEB_AUTH_DOMAIN FIREBASE_WEB_PROJECT_ID FIREBASE_WEB_MESSAGING_SENDER_ID FIREBASE_WEB_APP_ID FIREBASE_WEB_VAPID_KEY; do
            if [[ -n "${!name}" ]]; then
              printf '%s' "${!name}" | npx --yes wrangler versions secret put "$name" --name tiana-django-staging
            fi
          done
          # Fail closed: never activate the slots if both generated banner codes are absent.
          if [[ -z "${ADSTERRA_BANNER_320X50_CODE}" && -z "${ADSTERRA_BANNER_300X250_CODE}" ]]; then
            ADSTERRA_ENABLED=false
          fi
          for name in ADSTERRA_ENABLED ADSTERRA_WEBSITE_ID; do
            printf '%s' "${!name}" | npx --yes wrangler versions secret put "$name" --name tiana-django-staging
          done
          for name in ADSTERRA_BANNER_320X50_CODE ADSTERRA_BANNER_300X250_CODE; do
            if [[ -n "${!name}" ]]; then
              printf '%s' "${!name}" | npx --yes wrangler versions secret put "$name" --name tiana-django-staging
            fi
          done
          echo "Gemini, Firebase and Adsterra banner configuration was synced to the staging Worker. The existing Django signing secret was preserved."

      - name: Deploy to Cloudflare staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy

      - name: Smoke-test the deployed staging application
        shell: bash
        run: |
          set -euo pipefail
          url='https://tiana-django-staging.fosingkameni.workers.dev/'
          health_url="${url}health/"
          for attempt in {1..8}; do
            status=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$health_url" || true)
            if [[ "$status" == "200" ]]; then
              root_status=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$url" || true)
              if [[ "$root_status" =~ ^(200|301|302|303|307|308)$ ]]; then
                echo "TIANA staging application and PostgreSQL health checks passed (health HTTP $status; root HTTP $root_status)."
                exit 0
              fi
            fi
            echo "Staging database health check is not ready (HTTP ${status:-no-response}); retry $attempt/8."
            sleep 5
          done
          echo "::error::TIANA staging did not pass its PostgreSQL health check."
          exit 1
