name: Deploy TIANA Django Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tiana-django-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and deploy staging Worker
    runs-on: ubuntu-latest
    environment: tiana-django-staging
    permissions:
      contents: read
    env:
      DEBUG: "1"
      SECRET_KEY: "ci-static-collection-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_URL: "sqlite:///db.sqlite3"
      AI_PROVIDER: "none"
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cloudflare deployment credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN in GitHub environment tiana-django-staging."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID in GitHub environment tiana-django-staging."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Cloudflare deployment credentials are present."

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python Worker dependencies
        run: uv sync --all-groups

      - name: Check Django configuration and migrations
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: uv run python manage.py test

      - name: Check service-worker JavaScript
        run: |
          node --check tiana-service-worker.js
          node --check static/nkem/offline-core.js
          node --check static/nkem/offline.js
          node --check static/nkem/pwa.js
          node --check static/nkem/fcm.js

      - name: Collect Django static assets
        run: uv run python manage.py collectstatic --noinput

      - name: Deploy to Cloudflare staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy
