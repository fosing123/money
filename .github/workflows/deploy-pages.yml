name: Deploy Nkem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nkem-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate app shell
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check scripts/validate-site.mjs
      - name: Validate installable and offline app shell
        run: node scripts/validate-site.mjs

  build:
    name: Package site for Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      # First-time setup: Repository Settings → Pages → Source → GitHub Actions.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: |
            index.html
            app.css
            app.js
            sw.js
            manifest.webmanifest
            money-mark.svg
            terms.html
            privacy.html
            assets/**

  deploy:
    name: Publish live site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
