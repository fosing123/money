{% extends 'base.html' %}{% load static %}
{% block title %}Welcome to TIANA{% endblock %}
{% block extra_head %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"></noscript>
<link rel="stylesheet" href="{% static 'nkem/auth.css' %}?v=20261031-auth-flow-2">
{% endblock %}
{% block content %}
<div class="tiana-welcome-journey">
  <section class="tiana-welcome-card" aria-labelledby="tiana-welcome-title">
    <div class="tiana-welcome-art">
      <picture><source type="image/webp" srcset="{% static 'assets/optimized/tiana-signup-welcome-640.webp' %} 640w, {% static 'assets/optimized/tiana-signup-welcome-1200.webp' %} 1200w" sizes="(max-width: 760px) 100vw, 560px"><img src="{% static 'assets/tiana-signup-welcome.webp' %}" alt="A smiling student waving hello on campus" fetchpriority="high" decoding="async"></picture>
      <div class="tiana-welcome-art-glow"></div>
      <a class="tiana-welcome-logo" href="{% url 'home' %}" aria-label="TIANA — Your Money Friend Always">
        <picture class="tiana-optimized-logo"><source type="image/webp" srcset="{% static 'assets/optimized/tiana-logo-transparent-320.webp' %} 320w, {% static 'assets/optimized/tiana-logo-transparent-640.webp' %} 640w" sizes="220px"><img src="{% static 'assets/tiana-logo-transparent.png' %}" alt="TIANA — Your Money Friend Always" width="1660" height="716" decoding="async"></picture>
      </a>
      <span class="tiana-welcome-sparkle tiana-welcome-sparkle--one" aria-hidden="true">✦</span>
      <span class="tiana-welcome-sparkle tiana-welcome-sparkle--two" aria-hidden="true">✧</span>
    </div>
    <div class="tiana-welcome-copy">
      
      <h1 id="tiana-welcome-title">Welcome to <span>TIANA</span>, {{ request.user.first_name|default:"friend" }}! <span class="tiana-wave" aria-hidden="true">👋</span></h1>
      
      
      <a class="tiana-welcome-continue" href="{% url 'onboarding_setup' %}">
        <span>Let's build my money plan</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      
    </div>
  </section>
</div>
{% endblock %}
