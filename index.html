function load(){try{return {...initial,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{return {...initial}}}function readProfile(){try{return JSON.parse(localStorage.getItem('student-money-profile')||'{}')}catch{return {}}}function save(){localStorage.setItem(key,JSON.stringify(data))}function setProfile(p){profile=p;localStorage.setItem('student-money-profile',JSON.stringify(p))}

function onboarding(){let goals=['Save for a laptop','Build an emergency cushion','Pay school fees','Start a small business'];let picks=[];$('#root').innerHTML=`<div class="onboard"><div class="on-top"><div class="brand"><div class="mark">m</div><div>money.<small>MONEY, WITH MORE CLARITY</small></div></div><button class="skip" id="skip">Skip setup →</button></div><div class="on-grid"><section class="story"><div class="eyebrow">BUILT FOR REAL STUDENT LIFE</div><h1>Your money.<br><em>Your next move.</em></h1><p>University is already a lot. Get a clearer picture of your money, make it last longer, and move towards the things you want.</p><div class="benefits"><div class="benefit"><span class="benefit-icon">◈</span><div><strong>Private by default</strong><small>Your demo data stays on this device.</small></div></div><div class="benefit"><span class="benefit-icon">✳</span><div><strong>A little help, not judgment</strong><small>Simple guidance that speaks your language.</small></div></div><div class="benefit"><span class="benefit-icon">↗</span><div><strong>Progress you can see</strong><small>Turn small habits into real momentum.</small></div></div></div><div class="art"><div class="art-card"><small>YOUR MONEY, IN VIEW</small><strong>One step<br>at a time.</strong><div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div class="float"><small>WEEKLY PROGRESS</small><strong>+ a little clarity</strong><div class="track"><i></i></div></div></div></section><section class="card" id="on-card"></section></div><div class="on-bottom"><span>MADE FOR STUDENTS IN CAMEROON</span><span>FCFA · PRIVATE BY DEFAULT · NO PRESSURE</span></div></div>`;$('#skip').onclick=()=>finish({});renderStep();}
function renderStep(){const c=$('#on-card');let html='';if(step===0)html=`<div class="step-label">GETTING STARTED <span>01 / 03</span></div><div class="step-track"><i style="width:33%"></i></div><div class="step-icon">✳</div><h2>Let's make this yours.</h2><p class="sub">First, what should we call you?</p><label class="field">Your first name <small>OPTIONAL</small><input id="name" maxlength="40" placeholder="e.g. Sam" value="${profile.name||''}"></label><div class="note">◈ <span>No bank login. No mobile-money connection. Just a simple place to plan.</span></div><button class="btn full" id="next">Let's go →</button>`;if(step===1)html=`<div class="step-label">GETTING STARTED <span>02 / 03</span></div><div class="step-track"><i style="width:66%"></i></div><div class="step-icon">▣</div><h2>Start with today.</h2><p class="sub">A rough estimate is fine. You can change it later.</p><label class="field">Money you have right now<div class="amount"><input id="balance" type="number" min="0" value="${data.balance}"><span>FCFA</span></div></label><label class="field">Typical allowance or income<div class="amount"><input id="allowance" type="number" min="0" value="${data.allowance}"><span>FCFA</span></div></label><div class="cadence"><button data-cad="weekly" class="${(profile.cadence||'weekly')==='weekly'?'sel':''}">Every week</button><button data-cad="monthly" class="${profile.cadence==='monthly'?'sel':''}">Every month</button><button data-cad="irregular" class="${profile.cadence==='irregular'?'sel':''}">It varies</button></div><div class="actions"><button class="secondary" id="back">← Back</button><button class="btn" id="next">Next step →</button></div>`;if(step===2)html=`<div class="step-label">GETTING STARTED <span>03 / 03</span></div><div class="step-track"><i style="width:100%"></i></div><div class="step-icon">◎</div><h2>What are you working towards?</h2><p class="sub">Pick any that matter. You can add more later.</p><div class="goal-picks">${goals.map((g,i)=>`<button class="goal-pick ${(profile.goals||['Build an emergency cushion']).includes(g)?'sel':''}" data-goal="${g}"><span>${['💻','🛟','🎓','🚀'][i]}</span><strong>${g}</strong><span class="check">${(profile.goals||['Build an emergency cushion']).includes(g)?'✓':'+'}</span></button>`).join('')}</div><div class="note">✦ <span>We'll use this to make your dashboard more useful. No pressure to save a fixed amount.</span></div><div class="actions"><button class="secondary" id="back">← Back</button><button class="btn" id="finish">Build my money space →</button></div>`;c.innerHTML=html;$('#next')?.addEventListener('click',()=>{if(step===0)profile.name=$('#name').value.trim();if(step===1){data.balance=Math.max(0,Number($('#balance').value)||0);data.allowance=Math.max(0,Number($('#allowance').value)||0)}step++;renderStep()});$('#back')?.addEventListener('click',()=>{if(step===1)profile.name=$('#name')?.value||profile.name;step--;renderStep()});document.querySelectorAll('[data-cad]').forEach(b=>b.onclick=()=>{profile.cadence=b.dataset.cad;renderStep()});document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{let arr=profile.goals||['Build an emergency cushion'];profile.goals=arr.includes(b.dataset.goal)?arr.filter(g=>g!==b.dataset.goal):[...arr,b.dataset.goal];renderStep()});$('#finish')?.addEventListener('click',()=>finish(profile))}
function finish(p){setProfile({...p,name:(p.name||'Student').trim(),cadence:p.cadence||'weekly',goals:p.goals||['Build an emergency cushion']});data.goals=(p.goals||['Build an emergency cushion']).map((g,i)=>({id:Date.now()+i,name:g,target:g.includes('laptop')?150000:g.includes('school')?100000:g.includes('business')?50000:30000,saved:0,emoji:g.includes('laptop')?'💻':g.includes('school')?'🎓':g.includes('business')?'🚀':'🛟'}));data.transactions=[];save();localStorage.setItem('student-money-onboarded','true');dashboard()}
function totals(){return {income:data.transactions.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),spent:data.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0)}}function category(t){let s=t.toLowerCase();return /food|lunch|dinner|bread|meal|eat|chop/.test(s)?'Food':/taxi|bus|transport|bike|ride/.test(s)?'Transport':/data|airtime|internet|mtn|orange|bundle/.test(s)?'Airtime & data':/school|book|print|exam|course|tuition/.test(s)?'School':/rent|house|room|water|electricity/.test(s)?'Housing':'Other'}
function addTx(title,amount,type='expense',cat=null){amount=Math.round(Number(amount));if(!title||!amount||amount<1)return toast('Enter a description and a valid amount.');let c=cat||(type==='income'?'Income':category(title));data.transactions.unshift({id:Date.now(),title,amount,type,category:c,date:new Date().toLocaleDateString('en-GB')});data.balance=Math.max(0,data.balance+(type==='income'?amount:-amount));save();toast('Saved on this device.');dashboard()}
function openTx(type='expense'){modalType='tx';selectedType=type;$('#modal-root').innerHTML=`<div class="modal-bg" id="modal-bg"><section class="modal"><button class="modal-close" id="close">✕</button><h2>Add a transaction</h2><p>Keep your money picture up to date.</p><form class="form" id="txform"><div class="toggle"><button type="button" data-type="expense" class="${type==='expense'?'sel':''}">− Expense</button><button type="button" data-type="income" class="${type==='income'?'sel':''}">+ Income</button></div><label>Description<input id="tx-title" required placeholder="e.g. Lunch at campus"></label><label>Amount (FCFA)<input id="tx-amount" required type="number" min="1" placeholder="1500"></label><label>Category<select id="tx-cat"><option>Food</option><option>Transport</option><option>Airtime & data</option><option>School</option><option>Housing</option><option>Other</option><option>Income</option></select></label><button class="btn" type="submit">Save transaction ✓</button></form></section></div>`;$('#close').onclick=()=>$('#modal-root').innerHTML='';$('#modal-bg').onclick=e=>{if(e.target.id==='modal-bg')$('#modal-root').innerHTML=''};document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>openTx(b.dataset.type));$('#txform').onsubmit=e=>{e.preventDefault();addTx($('#tx-title').value,$('#tx-amount').value,selectedType,$('#tx-cat').value);$('#modal-root').innerHTML=''}}
function aiReply(text){let s=text.toLowerCase(),m=text.replaceAll(',','').match(/(\d+(?:\.\d+)?)\s*(?:fcfa|xaf)?/i);if(m&&/spent|paid|bought|received|earned|allowance|salary|sold|income/.test(s)){let income=/received|earned|allowance|salary|sold|income/.test(s);addTx(text.replace(/\d+(?:\.\d+)?\s*(?:fcfa|xaf)?/ig,'').replace(/\b(spent|paid|bought|received|earned|allowance|salary|sold|income|on|for|fcfa|xaf)\b/ig,'').trim()||'Money entry',Number(m[1]),income?'income':'expense');chat.push({role:'assistant',text:'Done — I recorded '+money(Number(m[1]))+' as '+(income?'income':'an expense')+'. Check the entry is correct.'});return}if(/afford|buy|purchase|can i/.test(s)){let n=m?Number(m[1]):0;chat.push({role:'assistant',text:n?(data.balance-n>=3000?'Based on your recorded balance, you could spend '+money(n)+' and still keep a 3,000 FCFA buffer. Check any bills not recorded first.':'Careful — this could leave less than your 3,000 FCFA safety buffer. Cover essentials first.'):'Your recorded balance is '+money(data.balance)+'. Tell me the price and I will compare it with your buffer.'});return}let t=totals();if(/save|goal|laptop|target/.test(s)){let g=data.goals[0];chat.push({role:'assistant',text:g?'Your '+g.name+' goal is '+money(g.saved)+' of '+money(g.target)+'. Try adding a small amount when your allowance arrives.':'Create a goal with a target amount and a date, then choose a realistic weekly contribution.'});return}chat.push({role:'assistant',text:'Your recorded balance is '+money(data.balance)+', with '+money(t.spent)+' in tracked expenses. I can log a transaction, check affordability, or review your spending. This helper is a local demo, not connected AI.'})}
function sendChat(text){text=(text||$('#chat-text')?.value||'').trim();if(!text)return;chat.push({role:'user',text});aiReply(text);dashboard('assistant')}
function dashboard(target=page){page=target;let t=totals(),spent=t.spent,planned=Object.values(data.budget).reduce((a,b)=>a+b,0),remaining=Math.max(0,planned-spent),safe=Math.max(0,Math.floor((data.balance-3000)/7));const root=$('#root');let body='';if(page==='dashboard')body=`<div class="welcome"><div><div class="eyebrow">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}).toUpperCase()}</div><h1>Make your money<br><em>make sense.</em></h1><p>A clearer view of your money means more room for the life you're building.</p></div><button class="btn" id="add-main">＋ Add transaction</button></div><section class="balance"><div><div class="bal-label">◈ &nbsp; TOTAL AVAILABLE BALANCE</div><div class="bal-number">${money(data.balance)}</div><div class="bal-caption">● Your current recorded balance · Updated just now</div></div><div class="bal-stats"><div><span>↙ Money in</span><strong>+${money(t.income)}</strong><span>Recorded income</span></div><div><span>↗ Money out</span><strong>${money(t.spent)}</strong><span>Recorded spending</span></div></div></section><div class="stats"><div class="stat"><div class="icon">◈</div><small>Safe to spend / day</small><strong>${money(safe)}</strong><em>Keeps a 3,000 FCFA buffer</em></div><div class="stat"><div class="icon">⌁</div><small>Tracked spending</small><strong>${money(spent)}</strong><em>${data.transactions.filter(x=>x.type==='expense').length} expense entries</em></div><div class="stat"><div class="icon">◎</div><small>Budget remaining</small><strong>${money(remaining)}</strong><em>${planned?Math.round(Math.min(100,spent/planned*100)):0}% of plan used</em></div></div><div class="columns"><section class="panel"><div class="panel-head"><div><small>YOUR ACTIVITY</small><h2>Recent transactions</h2></div><button class="link" data-page="transactions">View all →</button></div><div class="tx-list">${data.transactions.slice(0,5).map(txHtml).join('')||'<p class="sub">No transactions yet. Add your first expense or income to start seeing your money clearly.</p>'}</div><button class="bottom-link" id="add-bottom">＋ Add a transaction</button></section><section class="panel"><div class="panel-head"><div><small>SPENDING SNAPSHOT</small><h2>Where it goes</h2></div><button class="link" data-page="budgets">View budget →</button></div><div class="bars-chart">${Object.entries(data.budget).map(([c,limit])=>{let x=data.transactions.filter(v=>v.type==='expense'&&v.category===c).reduce((s,v)=>s+v.amount,0);return '<div class="barrow"><span>'+c+'</span><div class="bar"><i style="width:'+Math.min(100,limit?x/limit*100:0)+'%"></i></div><b>'+short(x)+' FCFA</b></div>'}).join('')}</div></section></div><section class="ai-banner"><div class="ai-icon">✳</div><div class="ai-copy"><small>MEET YOUR MONEY SIDEKICK</small><b>A little clarity goes a long way.</b><p>Describe a transaction, plan your week, or check what you can afford.</p></div><button class="btn" data-page="assistant">Talk to Money AI →</button></section>`;if(page==='transactions')body=pageHead('THE PAPER TRAIL','Every franc, accounted for.','Your recorded money in and money out, all in one place.')+'<section class="panel"><div class="toolbar"><input id="search-tx" placeholder="Search transactions…"><button class="btn" id="add-main">＋ Add transaction</button></div><div class="tx-list" id="all-tx">'+(data.transactions.map(txHtml).join('')||'<p class="sub">No entries yet. Add your first transaction.</p>')+'</div></section>';if(page==='budgets')body=pageHead('PLAN WITH PURPOSE','Give every franc a job.','Set realistic category limits and keep essentials covered.')+'<section class="panel"><div class="panel-head"><div><small>CATEGORY BREAKDOWN</small><h2>Your monthly plan</h2></div><button class="secondary" id="edit-budget">Edit budget</button></div><div class="bars-chart">'+Object.entries(data.budget).map(([c,l])=>{let x=data.transactions.filter(v=>v.type==='expense'&&v.category===c).reduce((s,v)=>s+v.amount,0);return '<div class="barrow"><span>'+c+'</span><div class="bar"><i style="width:'+Math.min(100,l?x/l*100:0)+'%"></i></div><b>'+money(Math.max(0,l-x))+' left</b></div>'}).join('')+'</div></section>';if(page==='goals')body=pageHead('YOUR FUTURE SELF SAYS THANKS','Make room for what matters.','A little saved consistently can move a big goal closer.')+'<button class="btn" id="new-goal">＋ New goal</button><div class="goal-grid" style="margin-top:14px">'+(data.goals.map((g,i)=>'<section class="panel goal-card"><div>'+escapeHtml(g.emoji)+'</div><h3>'+escapeHtml(g.name)+'</h3><b>'+money(g.saved)+' / '+money(g.target)+'</b><div class="bar"><i style="width:'+Math.min(100,g.saved/g.target*100)+'%"></i></div><small>'+Math.round(g.saved/g.target*100)+'% of target</small><button class="btn" data-save="'+g.id+'">＋ Add savings</button></section>').join('')||'<p class="sub">No goals yet. Create one to start planning for something that matters.</p>')+'</div>';if(page==='assistant')body=pageHead('YOUR MONEY SIDEKICK','Think it through, together.','Describe a transaction or ask a question about the money you have recorded.')+'<div class="chat"><section class="panel chat-box"><div class="chat-head">✳ Money AI <span style="float:right;color:#699875">LOCAL DEMO</span></div><div class="messages" id="messages">'+chat.map(m=>'<div class="bubble '+m.role+'">'+escapeHtml(m.text)+'</div>').join('')+'</div><form class="chat-form" id="chat-form"><input class="chat-input" id="chat-text" placeholder="e.g. Spent 1,200 FCFA on lunch" autocomplete="off"><button type="submit">➤</button></form><div class="chat-help">Your entries stay in this browser on this device. This helper is not connected to an AI service.</div></section><aside class="panel suggestions"><small class="eyebrow">TRY ASKING</small>'+['Spent 1,200 FCFA on lunch','Can I afford 3,000 FCFA shoes?','Where does most of my money go?','Help me save for a laptop'].map(s=>'<button data-prompt="'+s+'">'+s+'</button>').join('')+'</aside></div>';if(page==='marketplace'||page==='invest')body='<section class="coming"><div class="big-icon">'+(page==='invest'?'↗':'▣')+'</div><div class="eyebrow">SOMETHING GOOD IS GROWING</div><h1>'+(page==='invest'?'Your next chapter.':'Campus life, made easier.')+'<br><em>'+(page==='invest'?'Built with care.':'All in one place.')+'</em></h1><p>'+(page==='invest'?'A safer way to discover business-funding opportunities is being researched. Trust, transparency and the right safeguards come first.':'Buy, sell, discover student services and find useful local deals without endless searching.')+'</p><button class="btn" id="interest">♧ Notify me when it launches →</button><small>'+(page==='invest'?'No funds are accepted and no investments are offered.':'No listings or transactions are live yet.')+'</small></section>';if(page==='settings')body=pageHead('YOUR SPACE, YOUR RULES','Settings','Manage your local demo and understand how your data works.')+'<section class="panel"><h3>Privacy-first storage</h3><p class="sub">Your transactions are stored in this browser only. They are not synced to an account or backed up to a server.</p><button class="secondary" id="export">Export transactions (CSV)</button> <button class="secondary" id="reset">Reset local data</button><div class="notice">This prototype is a budgeting helper, not a bank, wallet, financial adviser, or payment processor.</div></section>';
root.innerHTML='<div class="app"><aside class="sidebar"><div class="brand"><div class="mark">m</div><div>money.<small>STUDENT MONEY</small></div></div><div class="side-label">YOUR SPACE</div><nav class="nav">'+[['dashboard','⌂','Overview'],['transactions','⌁','Transactions'],['budgets','◎','Budgets'],['goals','♡','Savings goals'],['assistant','✳','Money AI']].map(([id,ic,l])=>'<button data-page="'+id+'" class="'+(page===id?'active':'')+'">'+ic+' '+l+'</button>').join('')+'</nav><div class="side-promo"><b>Small steps. Big freedom.</b><p>Build better money habits, one day at a time.</p><button data-page="goals">Set a goal →</button></div><div class="side-foot">'+escapeHtml(profile.name||'Student')+' · Cameroon · FCFA</div></aside><main class="main"><header class="topbar"><div class="crumb">Student Money / <b>'+({dashboard:'Your money, in focus',transactions:'Transactions',budgets:'Your budgets',goals:'Savings goals',assistant:'Money AI',marketplace:'Campus Marketplace',invest:'Invest',settings:'Settings'}[page]||'Overview')+'</b></div><div class="pill">● &nbsp; FCFA</div></header><div class="content">'+body+'<footer class="footer"><div class="footer-brand">money.<small>Make your money make sense.</small></div><div class="footer-links"><button class="'+(page==='dashboard'?'active':'')+'" data-page="dashboard">▣ Money</button><button class="'+(page==='marketplace'?'active':'')+'" data-page="marketplace">▦ Marketplace <span class="soon">SOON</span></button><button class="'+(page==='invest'?'active':'')+'" data-page="invest">↗ Invest <span class="soon">SOON</span></button></div><div class="footnote">Built for students in Cameroon · Prototype v0.1 · Your data stays on this device</div></footer></div></main></div><div id="modal-root"></div>';
$('#add-main')?.addEventListener('click',()=>openTx());$('#add-bottom')?.addEventListener('click',()=>openTx());document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>dashboard(b.dataset.page));document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>sendChat(b.dataset.prompt));$('#chat-form')?.addEventListener('submit',e=>{e.preventDefault();sendChat()});$('#search-tx')?.addEventListener('input',e=>{let q=e.target.value.toLowerCase();$('#all-tx').innerHTML=data.transactions.filter(t=>(t.title+' '+t.category).toLowerCase().includes(q)).map(txHtml).join('')||'<p class="sub">No matching transactions.</p>'});$('#edit-budget')?.addEventListener('click',editBudget);$('#new-goal')?.addEventListener('click',newGoal);document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>addSavings(b.dataset.save));$('#interest')?.addEventListener('click',()=>toast('Thanks! Interest is noted only in this browser for now.'));$('#export')?.addEventListener('click',exportCSV);$('#reset')?.addEventListener('click',()=>{if(confirm('Clear local demo data and start over?')){localStorage.clear();location.reload()}})}
function txHtml(t){return '<div class="tx"><div class="tx-icon">'+(t.type==='income'?'↙':'•')+'</div><div class="tx-info"><b>'+escapeHtml(t.title)+'</b><small>'+escapeHtml(t.category)+' · '+escapeHtml(t.date)+'</small></div><div class="tx-amount '+(t.type==='income'?'positive':'')+'">'+(t.type==='income'?'+':'−')+money(t.amount)+'</div></div>'}function pageHead(e,t,p){return '<div class="page-head"><div class="eyebrow">'+e+'</div><h1>'+t+'</h1><p>'+p+'</p></div>'}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function editBudget(){let fields=Object.entries(data.budget).map(([k,v])=>'<label>'+k+'<input type="number" min="0" data-budget="'+k+'" value="'+v+'"></label>').join('');$('#modal-root').innerHTML='<div class="modal-bg" id="modal-bg"><section class="modal"><button class="modal-close" id="close">✕</button><h2>Shape your monthly budget</h2><p>These are planning limits, not money held by this website.</p><form class="form" id="budget-form">'+fields+'<button class="btn">Save monthly budget</button></form></section></div>';$('#close').onclick=()=>$('#modal-root').innerHTML='';$('#budget-form').onsubmit=e=>{e.preventDefault();document.querySelectorAll('[data-budget]').forEach(i=>data.budget[i.dataset.budget]=Math.max(0,Number(i.value)||0));save();$('#modal-root').innerHTML='';dashboard('budgets')}}
function newGoal(){ $('#modal-root').innerHTML='<div class="modal-bg" id="modal-bg"><section class="modal"><button class="modal-close" id="close">✕</button><h2>Create a savings goal</h2><p>Give something you are working towards a name.</p><form class="form" id="goal-form"><label>Goal name<input id="goal-name" required placeholder="e.g. School fees"></label><label>Target amount (FCFA)<input id="goal-target" type="number" min="1" required placeholder="50000"></label><label>Already saved (FCFA)<input id="goal-saved" type="number" min="0" value="0"></label><button class="btn">Create goal</button></form></section></div>';$('#close').onclick=()=>$('#modal-root').innerHTML='';$('#goal-form').onsubmit=e=>{e.preventDefault();data.goals.push({id:Date.now(),name:$('#goal-name').value,target:Number($('#goal-target').value),saved:Number($('#goal-saved').value)||0,emoji:'🎯'});save();$('#modal-root').innerHTML='';dashboard('goals')}}
function addSavings(id){let g=data.goals.find(x=>x.id==id),v=Number(prompt('How much FCFA would you like to add?', '1000'));if(!g||!v||v<1)return;g.saved=Math.min(g.target,g.saved+v);save();dashboard('goals')}function exportCSV(){let rows=[['Description','Category','Type','Amount FCFA','Date'],...data.transactions.map(t=>[t.title,t.category,t.type,t.amount,t.date])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a'),url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='student-money-transactions.csv';a.click();URL.revokeObjectURL(url)}function toast(t){let n=document.createElement('div');n.className='toast';n.textContent=t;document.body.appendChild(n);setTimeout(()=>n.remove(),2600)}
$('#root').innerHTML='';if(localStorage.getItem('student-money-onboarded')==='true')dashboard();else onboarding();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
